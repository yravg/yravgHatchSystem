name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from package.json packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.1" # shortcut: spec says Node 26 LTS candidate; move when 26 is LTS and verified
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm validate:spec
      - run: node packages/contracts/scripts/generate.ts --check
      - run: pnpm test:ticket -- 01 --allow-blocked # native equality runs in the jobs below
      - run: pnpm test:e2e
        env:
          PW_CHANNEL: chrome

  kotlin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - run: gradle --no-daemon :contracts:test
        working-directory: agents/android-tv

  dotnet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test Hatch.Contracts.Tests/Hatch.Contracts.Tests.csproj
        working-directory: agents
      - run: dotnet build HatchAgents.slnx
        working-directory: agents
