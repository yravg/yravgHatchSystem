name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-24.04
    services:
      postgres:
        # PostgreSQL 18.6, pinned by digest, same as the dev DB. Ephemeral CI container, published on localhost only.
        image: postgres@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          # CI-ONLY throwaway password for this ephemeral container; not used anywhere else.
          POSTGRES_PASSWORD: ci-only-throwaway
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # CI-ONLY connection string for the service container above.
      HATCH_PG_URL: postgres://postgres:ci-only-throwaway@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (version comes from package.json packageManager)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26.13.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm validate:spec
      - run: node packages/contracts/scripts/generate.ts --check
      # 01 has Gradle/.NET externals that run in the kotlin and dotnet jobs, so BLOCKED is allowed here only.
      - run: pnpm test:ticket -- 01 --allow-blocked
      # 46, 47, 48 have no external checks: no --allow-blocked.
      - run: pnpm test:ticket -- 46
      - run: pnpm test:ticket -- 47
      - run: pnpm test:ticket -- 48
      # 50 has two dotnet externals (VenueEdge tests); they run in the dotnet job (dotnet test HatchAgents.slnx), so BLOCKED is allowed here only.
      - run: pnpm test:ticket -- 50 --allow-blocked
      - run: pnpm test:e2e
        env:
          PW_CHANNEL: chrome

  kotlin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4 (uses the committed wrapper, Gradle 9.9.0 checksum pinned)
      # Android SDK without a third-party action: Google's cmdline-tools zip (22.0) pinned by sha256 (its sha1 equals the one in
      # repository2-3.xml), and only the android-sdk-license text is written, so no other licence is accepted.
      - name: Install Android SDK (platforms;android-36, build-tools;36.0.0)
        run: |
          set -euo pipefail
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools" "$SDK/licenses"
          curl -sfL -o "$RUNNER_TEMP/clt.zip" https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $RUNNER_TEMP/clt.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/clt.zip" -d "$RUNNER_TEMP/clt"
          mv "$RUNNER_TEMP/clt/cmdline-tools" "$SDK/cmdline-tools/22.0"
          printf '24333f8a63b6825ea9c5514f83c2829b004d1fee' > "$SDK/licenses/android-sdk-license"
          "$SDK/cmdline-tools/22.0/bin/sdkmanager" --sdk_root="$SDK" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV" # the runner image presets its own; both must name the SDK installed above
      - name: Gradle tests and debug build
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest assembleDebug :contracts:test 2>&1 | tee "$RUNNER_TEMP/gradle.log"
        working-directory: agents/android-tv
      - name: Surface the Gradle failure as annotations
        if: failure()
        run: grep -E "FAILED|What went wrong|Could not|Exception|error:|SDK|licen" "$RUNNER_TEMP/gradle.log" | head -10 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done

  dotnet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - run: dotnet test HatchAgents.slnx
        working-directory: agents
      - run: dotnet build HatchAgents.slnx
        working-directory: agents
